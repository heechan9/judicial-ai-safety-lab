[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="judicial-ai-safety-lab"
version="6.5.0"
requires-python=">=3.11"
dependencies=[]
[project.scripts]
jaisl="judicial_ai_safety_lab.cli:main"
jaisl-review="judicial_ai_safety_lab.review_cli:main"
jaisl-verify="judicial_ai_safety_lab.verify_cli:main"
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
