name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      - id: tests
        continue-on-error: true
        run: pytest -q --junitxml=pytest.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest.xml
      - if: steps.tests.outcome != 'success'
        run: exit 1
