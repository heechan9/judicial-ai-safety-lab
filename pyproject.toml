[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="judicial-ai-safety-lab"
version="8.5.0"
requires-python=">=3.11"
dependencies=[]
[project.scripts]
jaisl="judicial_ai_safety_lab.cli:main"
jaisl-review="judicial_ai_safety_lab.review_cli:main"
jaisl-verify="judicial_ai_safety_lab.verify_cli:main"
jaisl-realdata="judicial_ai_safety_lab.real_data_cli:main"
jaisl-expert="judicial_ai_safety_lab.expert_cli:main"
jaisl-pilot="judicial_ai_safety_lab.pilot_cli:main"
jaisl-audit="judicial_ai_safety_lab.audit_cli:main"
jaisl-expert-packet="judicial_ai_safety_lab.expert_packet_cli:main"
jaisl-validation="judicial_ai_safety_lab.validation_cli:main"
jaisl-precedent-collect="judicial_ai_safety_lab.precedent_collect_cli:main"
jaisl-discovery="judicial_ai_safety_lab.discovery_cli:main"
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
